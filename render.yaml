# Render Blueprint: one web service runs the API and serves the built React site.
# Render dashboard → New → Blueprint → pick this repo. Secrets (sync: false) are asked for on first deploy.
services:
  - type: web
    name: vypaarmitra
    runtime: node
    plan: starter # always on and outbound email (SMTP) allowed; the free plan sleeps and blocks SMTP
    region: singapore # closest Render region to India
    buildCommand: >-
      npm ci --prefix backend --omit=dev &&
      npm ci --prefix frontend --include=dev &&
      npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://vypaarmitra.com,https://www.vypaarmitra.com
      - key: SMTP_HOST
        value: smtpout.secureserver.net
      - key: SMTP_PORT
        value: "465"
      # Secrets: copy the values from backend/.env and frontend/.env when Render asks.
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: LEAD_NOTIFY_TO
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VITE_WHATSAPP_NUMBER
        sync: false
      - key: VITE_GA_ID
        sync: false
