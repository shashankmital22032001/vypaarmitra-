# Nginx in front of the Node app (port 5000). Certbot adds the HTTPS parts to this file.

# www.vypaarmitra.com -> vypaarmitra.com
server {
    listen 80;
    listen [::]:80;
    server_name www.vypaarmitra.com;

    location / {
        return 301 https://vypaarmitra.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name vypaarmitra.com;

    client_max_body_size 100k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Chatbot replies stream word by word: don't buffer them.
    location /api/chat {
        proxy_pass http://127.0.0.1:5000;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
    }
}
