    <!--
      Start-up loader "Dukaan se Desh tak" (about 5.5s):
        0.1s  the shop (M tile) appears
        0.4s  "vypaarmitra" rises letter by letter, then the tagline and "From Kashmir to Kanyakumari"
        1.2s  routes draw from the shop one by one (Kashmir first, Kanyakumari last), a parcel rides
              each route and the city lights up when it arrives
        5.4s  the screen lifts like a shop shutter
      Inline so it paints before the JS bundle; src/lib/loader.js dismisses it.
    -->
    <style>
      html.is-loading { overflow: hidden; }
      #vm-loader {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: #0f2a43; color: #fff;
        font-family: 'Space Grotesk', system-ui, sans-serif;
        transition: transform 0.9s cubic-bezier(0.76, 0, 0.24, 1) 0.25s, visibility 0s linear 1.15s;
        /* Safety net: never cover the page if the app fails to start. */
        animation: vml-auto 0.4s ease 14s forwards;
      }
      #vm-loader::before {
        content: ''; position: absolute; inset: 0; pointer-events: none;
        background:
          radial-gradient(520px 420px at 50% 42%, rgb(245 166 35 / 0.13), transparent 70%),
          radial-gradient(rgb(255 255 255 / 0.07) 1px, transparent 1px) 0 0 / 14px 14px;
        -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 75%);
        mask-image: radial-gradient(ellipse at 50% 45%, #000 30%, transparent 75%);
      }
      /* Gold progress line along the bottom edge of the shutter */
      #vm-loader::after {
        content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
        background: linear-gradient(90deg, #d98a0b, #f5a623, #ffc861);
        transform-origin: left; transform: scaleX(0);
        animation: vml-bar 5s cubic-bezier(0.45, 0, 0.55, 1) 0.2s forwards;
      }
      #vm-loader.is-leaving { transform: translateY(-100%); visibility: hidden; }
      .vml-stage {
        position: relative; display: flex; flex-direction: column; align-items: center;
        gap: 12px; padding: 24px; text-align: center;
        transition: opacity 0.4s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #vm-loader.is-leaving .vml-stage { opacity: 0; transform: translateY(-28px) scale(0.97); }
      .vml-map { width: min(300px, 74vw); height: auto; overflow: visible; margin-bottom: 8px; }

      .vml-trail { fill: none; stroke: rgb(255 255 255 / 0.16); stroke-width: 1.5; stroke-dasharray: 0.012 0.028; }
      .vml-route {
        fill: none; stroke: #f5a623; stroke-width: 2.2; stroke-linecap: round;
        stroke-dasharray: 1; stroke-dashoffset: 1;
        filter: drop-shadow(0 0 4px rgb(245 166 35 / 0.6));
        animation: vml-draw 1s cubic-bezier(0.45, 0, 0.55, 1) var(--d) forwards;
      }
      .vml-dot, .vml-ring { transform-box: fill-box; transform-origin: center; }
      .vml-dot { fill: #f5a623; transform: scale(0); animation: vml-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) calc(var(--d) + 0.95s) forwards; }
      .vml-ring { fill: none; stroke: #f5a623; stroke-width: 1.5; opacity: 0; animation: vml-ring 1.3s ease-out calc(var(--d) + 0.95s) forwards; }
      .vml-label {
        fill: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
        opacity: 0; animation: vml-fade 0.5s ease calc(var(--d) + 1.05s) forwards;
      }
      .vml-hub { transform-box: fill-box; transform-origin: center; animation: vml-hub 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s both; }
      .vml-halo { fill: rgb(245 166 35 / 0.18); transform-box: fill-box; transform-origin: center; animation: vml-halo 1.8s ease-out 0.4s infinite; }

      .vml-word { display: flex; font-size: clamp(1.9rem, 1.4rem + 2vw, 2.6rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
      .vml-word span { display: inline-block; opacity: 0; animation: vml-rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) calc(0.4s + var(--i) * 0.06s) forwards; }
      .vml-word .g { color: #f5a623; }
      .vml-tag {
        font-size: 0.8125rem; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #f5a623;
        opacity: 0; animation: vml-rise 0.6s ease 1.1s forwards;
      }
      .vml-sub {
        font-family: 'Inter', system-ui, sans-serif; font-size: 1rem; color: rgb(255 255 255 / 0.8);
        opacity: 0; animation: vml-rise 0.6s ease 1.5s forwards;
      }
      .vml-skip {
        position: absolute; right: 20px; bottom: 24px;
        padding: 8px 16px; border: 1px solid rgb(255 255 255 / 0.25); border-radius: 999px;
        background: transparent; color: rgb(255 255 255 / 0.75);
        font: 600 0.8125rem 'Inter', system-ui, sans-serif; cursor: pointer;
        opacity: 0; animation: vml-fade 0.4s ease 1.5s forwards;
      }
      .vml-skip:hover, .vml-skip:focus-visible { border-color: #f5a623; color: #f5a623; outline: none; }

      @keyframes vml-draw { to { stroke-dashoffset: 0; } }
      @keyframes vml-pop { to { transform: scale(1); } }
      @keyframes vml-ring { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.6); } }
      @keyframes vml-fade { to { opacity: 1; } }
      @keyframes vml-hub { from { opacity: 0; transform: scale(0.4) rotate(-12deg); } }
      @keyframes vml-halo { 0% { opacity: 0.9; transform: scale(0.9); } 100% { opacity: 0; transform: scale(1.9); } }
      @keyframes vml-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes vml-bar { to { transform: scaleX(1); } }
      @keyframes vml-auto { to { opacity: 0; visibility: hidden; } }

      @media (prefers-reduced-motion: reduce) {
        #vm-loader, #vm-loader *, #vm-loader::after { animation: none !important; }
        #vm-loader { transition: opacity 0.3s ease, visibility 0s linear 0.3s; }
        #vm-loader.is-leaving { transform: none; opacity: 0; }
        .vml-route { stroke-dashoffset: 0; }
        .vml-dot { transform: none; }
        .vml-label, .vml-word span, .vml-tag, .vml-sub, .vml-skip { opacity: 1; }
        .vml-parcel, .vml-ring, .vml-halo { display: none; }
      }
    </style>
